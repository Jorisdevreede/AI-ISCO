<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job tree — AI-ISCO</title>
<meta name="description" content="The whole ISCO-08 hierarchy as an expandable tree, from the ten major groups down to every job, with the skills and quadrant of whichever job you pick.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/tree.css">
<link rel="preload" href="groups.json" as="fetch" crossorigin>
<link rel="preload" href="search_index.json" as="fetch" crossorigin>
</head>
<body>

<!-- Must be static markup: scorer.js looks this element up by id. -->
<nav id="site-nav"></nav>

<main id="main" class="page tree-page">

  <header class="tree-head">
    <h1>Job tree</h1>
    <p class="muted">Every ISCO-08 group opened level by level, down to the individual jobs. Pick a group to see how it splits, or a job to see its skills.</p>
  </header>

  <p class="loading" id="tree-status" role="status" aria-live="polite" hidden>Loading the tree…</p>
  <div class="error-block" id="tree-error" hidden></div>

  <div class="tree-layout" id="tree-layout" hidden>

    <section class="tree-pane" aria-labelledby="tree-pane-title">
      <h2 id="tree-pane-title" class="section-heading">The ISCO-08 hierarchy</h2>

      <div class="tree-tools">
        <div class="tree-filter">
          <label for="tree-q">Filter the tree</label>
          <input type="search" id="tree-q" placeholder="programmer, nurse, welder…" autocomplete="off" spellcheck="false">
        </div>
        <button type="button" class="button button--quiet" id="tree-collapse">Collapse all</button>
      </div>

      <p class="small muted tree-count-line" id="tree-count" role="status" aria-live="polite"></p>

      <div class="tree-scroll">
        <ul id="tree" class="tree" role="tree" aria-label="ISCO-08 occupations"></ul>
      </div>
    </section>

    <section class="tree-detail card" id="detail" tabindex="-1" aria-labelledby="detail-title">
      <button type="button" class="button button--quiet tree-back" id="detail-back">Back to the tree</button>
      <h2 id="detail-title">Pick a job in the tree to see its skills</h2>
      <div id="detail-body"></div>
    </section>

  </div>

</main>

<script src="scorer.js" defer></script>
<script type="module" src="js/pages/tree.js"></script>
</body>
</html>
