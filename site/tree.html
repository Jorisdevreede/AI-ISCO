<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job tree — AI-ISCO</title>
<meta name="description" content="The whole ISCO-08 hierarchy as an expandable tree, from the ten major groups down to every job, with the skills of whichever job you pick.">
<meta property="og:site_name" content="AI-ISCO">
<meta property="og:type" content="website">
<meta property="og:title" content="Job tree — AI-ISCO">
<meta property="og:description" content="The whole ISCO-08 hierarchy as an expandable tree, from the ten major groups down to every job, with the skills of whichever job you pick.">
<meta property="og:url" content="https://jorisdevreede.github.io/AI-ISCO/tree.html">
<meta property="og:image" content="https://jorisdevreede.github.io/AI-ISCO/card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/tree.css">
<!-- No rel=preload for the index files: which set is active is decided by
     scorer.js at run time, so a static hint can only name the wrong one and
     doubles the page weight (it fetched both sets: 3.5 MB). -->
</head>
<body>

<!-- Must be static markup: scorer.js looks this element up by id. -->
<nav id="site-nav"></nav>

<main id="main" class="page tree-page">

  <header class="tree-head">
    <h1>Job tree</h1>
    <p class="muted">Every ISCO-08 group opened level by level, down to the individual jobs. Pick a group to see how it splits, or a job to see its skills.</p>
  </header>

  <p class="loading" id="tree-status" role="status" aria-live="polite" hidden>Loading the tree…</p>
  <div class="error-block" id="tree-error" hidden></div>

  <div class="tree-layout" id="tree-layout" hidden>

    <section class="tree-pane" aria-labelledby="tree-pane-title">
      <h2 id="tree-pane-title" class="section-heading">The ISCO-08 hierarchy</h2>

      <div class="tree-tools">
        <div class="tree-filter">
          <label for="tree-q">Filter the tree</label>
          <input type="search" id="tree-q" placeholder="programmer, nurse, welder…" autocomplete="off" spellcheck="false">
        </div>
        <button type="button" class="button button--quiet" id="tree-collapse">Collapse all</button>
      </div>

      <p class="small muted tree-count-line" id="tree-count" role="status" aria-live="polite"></p>

      <!-- A filter is a question about jobs, so it is answered with jobs. The
           hierarchy that holds them is the second question, and waits behind the
           disclosure below. -->
      <div id="tree-results" hidden>
        <ul id="tree-results-list" class="result-list" aria-labelledby="tree-count"></ul>
      </div>

      <details id="tree-hierarchy" class="tree-disclosure" open>
        <summary id="tree-hierarchy-summary">Show in the hierarchy</summary>
        <p class="small muted tree-key" id="tree-key"></p>
        <div class="tree-scroll">
          <ul id="tree" class="tree" role="tree" aria-label="ISCO-08 occupations"></ul>
        </div>
      </details>
    </section>

    <section class="tree-detail card" id="detail" tabindex="-1" aria-labelledby="detail-title">
      <button type="button" class="button button--quiet tree-back" id="detail-back">Back to the tree</button>
      <h2 id="detail-title">Pick a job in the tree to see its skills</h2>
      <div id="detail-body"></div>
    </section>

  </div>

</main>

<script src="scorer.js" defer></script>
<script type="module" src="js/pages/tree.js"></script>
</body>
</html>
