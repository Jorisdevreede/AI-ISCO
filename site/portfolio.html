<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moved to job.html — AI-ISCO</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<link rel="canonical" href="job.html">
<link rel="stylesheet" href="css/app.css">
<script>
// The job page lives at job.html now. Old links carry the occupation in the
// hash and sometimes ?scorer= in the query, so both are handed over unchanged.
// replace(), not assign(), so Back does not bounce between the two pages.
(function () {
  var target = 'job.html' + window.location.search + window.location.hash;
  window.location.replace(target);
}());
</script>
</head>
<body>
<main id="main" class="page">
  <h1>This page moved</h1>
  <p>The job analysis lives at <a id="target" href="job.html">job.html</a>.</p>
  <noscript>
    <p><a href="job.html">Open the job page</a>, then search for the occupation you wanted.</p>
  </noscript>
</main>
<script>
// Keep the visible link honest when the redirect is blocked or slow.
(function () {
  var anchor = document.getElementById('target');
  if (anchor) anchor.href = 'job.html' + window.location.search + window.location.hash;
}());
</script>
</body>
</html>
