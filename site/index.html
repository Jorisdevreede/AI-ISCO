<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find a job — AI-ISCO</title>
<meta name="description" content="Search European occupations and see how exposed each one is to AI: what AI could take over, what it could assist with, and what stays human. Model estimates, not forecasts.">
<meta property="og:site_name" content="AI-ISCO">
<meta property="og:type" content="website">
<meta property="og:title" content="Find a job — AI-ISCO">
<meta property="og:description" content="Search European occupations and see how exposed each one is to AI: what AI could take over, what it could assist with, and what stays human. Model estimates, not forecasts.">
<meta property="og:url" content="https://jorisdevreede.github.io/AI-ISCO/">
<meta property="og:image" content="https://jorisdevreede.github.io/AI-ISCO/card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/app.css">
<!-- No <link rel="preload"> for search_index: site/scorer.js decides at run
     time which set the page reads, so preloading the unsuffixed name downloads
     half a megabyte the default set never uses. -->
<style>
/* Page-specific rules for the landing page only. Shared components and tokens
   live in css/app.css; nothing here may be needed by another page. */

.hero { padding: var(--space-6) 0 var(--space-2); }
.hero h1 { max-width: 20ch; }
.hero-sub { max-width: 62ch; font-size: 1.0625rem; color: var(--fg-muted); }

.hero-label { display: block; margin-bottom: var(--space-2); font-size: 0.875rem; font-weight: 600; }

/* The hint line sits between the input and the floating list, so a "+ N more"
   or "no job called X" message is never covered by the results. */
.combobox li .title { font-weight: 550; }
.combobox li .meta { font-size: 0.75rem; color: var(--fg-muted); }

.search-hint { margin: var(--space-3) 0 0; font-size: 0.875rem; color: var(--fg-muted); }
.search-hint p { margin: 0 0 var(--space-2); }
.search-hint p:last-child { margin-bottom: 0; }

/* The nearest-titles list lives inside .combobox so the results list stays
   anchored below it, which means it inherits the floating listbox rules from
   app.css. Put it back in the flow. */
.search-hint .nearest-list {
  position: static;
  max-height: none;
  margin: 0 0 var(--space-2);
  padding: 0;
  overflow: visible;
  list-style: none;
  background: none;
  border: 0;
  box-shadow: none;
}
.search-hint .nearest-list li {
  display: block;
  min-height: 0;
  padding: 0;
  cursor: auto;
}
.search-hint .nearest-list a {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: var(--tap);
}

.section { margin-top: var(--space-6); }
.section h2 {
  margin-bottom: var(--space-3);
  font-size: 0.8125rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-muted);
}

/* A chip names the job it opens and, beside it, what kind of job the active
   score set says it is: the quadrant's name, or the type's short name. The
   class sits outside the link so the link's text is the job title and nothing
   else. */
.chip-item {
  display: inline-flex;
  align-items: center;
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
}
.chip-item:hover { background: rgba(255, 255, 255, 0.08); }
.chip-item .chip { background: none; border: 0; }
.chip-item .chip:hover { background: none; }
.chip-meta, .recent-meta {
  font-size: 0.75rem;
  color: var(--fg-muted);
  white-space: nowrap;
}
.chip-meta { padding-right: var(--space-3); }
.recent-meta { padding-left: var(--space-1); }
.chip-meta::before, .recent-meta::before { content: '· '; }

.recent-list { display: flex; flex-wrap: wrap; gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
.recent-item {
  display: inline-flex;
  align-items: center;
  padding-left: var(--space-3);
  background: var(--bg3);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
}
.recent-item a {
  display: inline-flex;
  align-items: center;
  min-height: var(--tap);
  padding: var(--space-1) 0;
  font-size: 0.875rem;
  color: var(--fg);
  text-decoration: none;
}
.recent-item a:hover { text-decoration: underline; }
.recent-remove {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 32px;
  min-height: 32px;
  margin-left: var(--space-1);
  font: inherit;
  color: var(--fg-muted);
  background: transparent;
  border: 0;
  border-radius: var(--radius-sm);
  cursor: pointer;
}
.recent-remove:hover { color: var(--fg); background: rgba(255, 255, 255, 0.08); }

.more-links { display: flex; flex-wrap: wrap; gap: var(--space-3); margin-top: var(--space-7); }
.error-actions { display: flex; flex-wrap: wrap; gap: var(--space-3); margin: 0; }
</style>
</head>
<body>

<!-- Must be static markup: scorer.js looks this element up by id. -->
<nav id="site-nav"></nav>

<main id="main" class="page">

  <section class="hero">
    <h1>Will AI change your job?</h1>
    <p id="subtitle" class="hero-sub"></p>

    <div class="hero-search">
      <label class="hero-label" for="job-search">Find your job title</label>
      <div class="combobox">
        <input id="job-search" type="text" enterkeyhint="go"
               placeholder="Type a job title, for example programmer">
        <div id="search-hint" class="search-hint" hidden></div>
        <ul id="job-listbox"></ul>
      </div>
      <p id="search-status" class="visually-hidden" role="status" aria-live="polite"></p>
      <p id="search-loading" class="loading" hidden>Loading job titles…</p>
      <div id="search-error"></div>
    </div>
  </section>

  <section class="section" id="popular-section">
    <h2 id="popular-heading">Popular jobs</h2>
    <div class="chip-row" id="chip-row"></div>
  </section>

  <section class="section" id="recent-section" hidden>
    <h2 id="recent-heading">Recently viewed</h2>
    <ul class="recent-list" id="recent-list" aria-labelledby="recent-heading"></ul>
  </section>

  <nav class="more-links" aria-label="Other ways to explore">
    <a class="button button--quiet" id="browse-link" href="groups.html#g=all">Or browse a whole sector →</a>
    <a class="button button--quiet" id="skill-link" href="skill.html">Skill scores →</a>
  </nav>

</main>

<script src="scorer.js" defer></script>
<script type="module" src="js/pages/landing.js"></script>
</body>
</html>
