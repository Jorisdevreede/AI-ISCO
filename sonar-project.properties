sonar.projectKey=ai-isco
sonar.projectName=AI-ISCO
sonar.host.url=http://localhost:9000

sonar.sources=aiisco/,ingest_esco.py,score_skills.py,score_skills_typesafe.py,score_skills_v2.py,compare_skill_scores.py,aggregate_scores.py,generate_narratives.py,merge_narrative_shards.py,build_portfolio_data.py,build_site_indexes.py,site/js/,site/css/,site/scorer.js,site/index.html,site/job.html,site/groups.html,site/tree.html,site/skill.html,site/method.html,site/insights.html,site/portfolio.html,site/explorer.html

sonar.tests=tests/

sonar.exclusions=html/**,data/**,site/**/*.json,site/jobs/**,site/skill_notes/**,site/skill_answers_v2/**,tests/fixtures/**,node_modules/**,.venv/**,.claude/**,.beads/**,score.py,make_prompt.py,build_site_data.py,make_csv.py,process.py,scrape.py,parse_detail.py,parse_occupations.py,prompt.md,scores.json,occupations.json,occupations.csv,occupational_outlook_handbook.html

sonar.python.version=3.10

sonar.python.coverage.reportPaths=sonar-reports/coverage.xml
sonar.javascript.lcov.reportPaths=sonar-reports/lcov.info

# Modules that only wire the DOM up. They carry no branching logic of their own
# (that lives in the *-model.js twin) and are exercised end to end in a real
# browser by tests/e2e, which Sonar cannot see. Nothing else is excluded: every
# pure module under site/js/ is unit-tested by `npm test`.
sonar.coverage.exclusions=\
  site/js/pages/job.js,\
  site/js/pages/groups.js,\
  site/js/pages/tree.js,\
  site/js/pages/tree-view.js,\
  site/js/pages/skill.js,\
  site/js/pages/insights.js,\
  site/js/pages/method.js,\
  site/js/pages/landing.js,\
  site/js/pages/treemap-view.js,\
  site/js/combobox.js,\
  site/js/chrome.js,\
  site/js/badge.js,\
  site/js/info-note.js,\
  site/js/shares-bar.js,\
  site/scorer.js

# Narrow, per-file exceptions. Each one is a rule that is wrong about this exact
# element, not a rule we disagree with: nothing here is switched off globally.
sonar.issue.ignore.multicriteria=canvasRole,canvasImg,tabPanel,ariaTree

# S6843/S6819 on site/job.html: the skill plot is a <canvas> drawn at run time,
# so it cannot be an <img>; role="img" + aria-label + the "View as table"
# alternative below it is the WAI-ARIA pattern for a drawn chart, and
# tests/e2e/test_charts.py asserts exactly that. The only role= in the file.
sonar.issue.ignore.multicriteria.canvasRole.ruleKey=Web:S6843
sonar.issue.ignore.multicriteria.canvasRole.resourceKey=site/job.html
sonar.issue.ignore.multicriteria.canvasImg.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.canvasImg.resourceKey=site/job.html

# S6845 on site/groups.html: #panel is the tabpanel of the four-view tab set.
# The WAI-ARIA authoring practice for tabs puts tabindex="0" on the panel so
# keyboard users can reach content that holds no focusable element of its own.
sonar.issue.ignore.multicriteria.tabPanel.ruleKey=Web:S6845
sonar.issue.ignore.multicriteria.tabPanel.resourceKey=site/groups.html

# S6842 on site/tree.html: <ul role="tree"> with role="treeitem" children is
# the WAI-ARIA tree pattern itself. A list is the element the pattern is built
# on; there is no "interactive element" to move the role to.
sonar.issue.ignore.multicriteria.ariaTree.ruleKey=Web:S6842
sonar.issue.ignore.multicriteria.ariaTree.resourceKey=site/tree.html

sonar.sourceEncoding=UTF-8
